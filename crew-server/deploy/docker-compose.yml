# One user's bots on one machine. `install.sh` writes .env (token, public URL) next to this file.
services:
  crew:
    build:
      context: ..
      args:
        CREW_COMMIT: ${CREW_COMMIT:-}
    image: crew-server:local
    restart: unless-stopped
    environment:
      CREW_AUTH_TOKEN: ${CREW_AUTH_TOKEN}
      CREW_PUBLIC_URL: ${CREW_PUBLIC_URL}
      CREW_PORT: "5200"
      CREW_BIND: 0.0.0.0
    volumes:
      - crew-data:/data
      # The code is bind-mounted from the checkout, so pulling a new commit only needs a restart, not a rebuild.
      # Dependencies and the browser still come from the image; changing package.json or the Dockerfile rebuilds.
      - ../src:/app/src:ro
      - ../scripts:/app/scripts:ro
      - ../library:/app/library:ro
    ports:
      - "${CREW_PORT:-5200}:5200"
volumes:
  crew-data:
