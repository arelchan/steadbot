<!--
  竖屏模板 · image-text（上图下文 / 图文卡）
  小红书经典版式：上方视觉区（60%）+ 下方标题正文。
  视觉区把 emoji 换成 <img src="..."> 即用真实图；不换就是渐变装饰。
-->
<div class="slide" id="sN" style="padding: 0; gap: 0; justify-content: flex-start;">
  <div class="p-hero-img" style="height: 60%;">
    🚀
    <!-- 换真实图：<img src="assets/your-image.jpg" alt=""> -->
  </div>

  <div style="padding: var(--p-pad); display: flex; flex-direction: column; gap: 18px; flex: 1 1 auto; justify-content: center;">
    <div class="p-eyebrow">{副标题英文} · {大类名}</div>
    <div class="p-h1">{标题 · <span>关键词</span>}</div>
    <div class="p-lead">{正文说明 · 含 <strong>关键数字</strong> · 配合上图讲一件事}</div>
  </div>
</div>
