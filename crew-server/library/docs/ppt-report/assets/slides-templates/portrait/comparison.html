<!--
  竖屏模板 · comparison（A vs B 对比）
  低密度：两栏对比（对象 + 大数字 + 一句说明）+ 一句结论。胜方栏加描边强调。
-->
<div class="slide between" id="sN">
  <div>
    <div class="p-eyebrow">{副标题英文} · 对比</div>
    <div class="p-h1" style="margin-top: 24px;">{对比标题 · <span>前后</span>}</div>
  </div>

  <div class="p-vs">
    <div class="p-card p-vs-col">
      <div class="p-vs-label">{对象 A · 上线前}</div>
      <div class="p-display sm" style="color: var(--text3);">42<span class="unit">%</span></div>
      <div class="p-body" style="margin-top: 14px;">{一句说明}</div>
    </div>
    <div class="p-card p-vs-col win">
      <div class="p-vs-label">{对象 B · 上线后}</div>
      <div class="p-display sm">68<span class="unit">%</span></div>
      <div class="p-body" style="margin-top: 14px;">{一句说明}</div>
    </div>
  </div>

  <div class="p-lead">{对比结论 · <strong>+26pt</strong> · 告诉读者差距有多大}</div>
</div>
