<!--
  竖屏模板 · end（结尾 / 小结 + CTA）
  低密度：一句话带走的核心判断 + 一个行动号召（关注/转发）+ 品牌页脚。
-->
<div class="slide between" id="sN">
  <div class="p-eyebrow">小结 · SUMMARY</div>

  <div>
    <div class="p-h1" style="font-size: 72px;">{一句话<span>带走的判断</span>}</div>
    <div class="p-lead" style="margin-top: 28px;">
      {核心结论复述 · 含 <strong>关键数字</strong> · 让读者记住这一条}
    </div>
  </div>

  <div>
    <div class="p-chip" style="font-size: 28px; padding: 16px 30px;">👉 关注 / 转发 · 下期继续</div>
    <div class="p-foot" style="margin-top: 36px;">
      <span class="brand">{品牌 / 作者}</span>
      <span>{日期 / 期数}</span>
    </div>
  </div>
</div>
