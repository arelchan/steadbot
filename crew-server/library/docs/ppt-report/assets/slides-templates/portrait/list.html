<!--
  竖屏模板 · list（3~5 项要点列表）
  低密度：每项一行，序号 + 标题 + 一句说明 + 右侧大数字。最多 5 项，多了拆页。
-->
<div class="slide between" id="sN">
  <div>
    <div class="p-eyebrow">{副标题英文} · {大类名}</div>
    <div class="p-h1" style="margin-top: 26px;">{本页标题 · <span>核心观点</span>}</div>
  </div>

  <div class="p-list">
    <div class="p-list-item">
      <div class="p-list-num">01</div>
      <div class="p-list-tx">
        <div class="p-list-h">{要点一标题}</div>
        <div class="p-list-sub">{一句说明 · 含口径}</div>
      </div>
      <div class="p-list-big">62%</div>
    </div>
    <div class="p-list-item">
      <div class="p-list-num">02</div>
      <div class="p-list-tx">
        <div class="p-list-h">{要点二标题}</div>
        <div class="p-list-sub">{一句说明}</div>
      </div>
      <div class="p-list-big">$22</div>
    </div>
    <div class="p-list-item">
      <div class="p-list-num">03</div>
      <div class="p-list-tx">
        <div class="p-list-h">{要点三标题}</div>
        <div class="p-list-sub">{一句说明}</div>
      </div>
      <div class="p-list-big">8.4×</div>
    </div>
  </div>

  <div class="p-foot">
    <span class="brand">{品牌 / 作者}</span>
    <span>{页码}</span>
  </div>
</div>
