<!--
  竖屏模板 · timeline（竖向时间线 / 里程碑）
  低密度：3~4 个节点，每个 日期 + 里程碑 + 一句说明。给"复盘历程/路线图"用。
-->
<div class="slide between" id="sN">
  <div>
    <div class="p-eyebrow">历程 · TIMELINE</div>
    <div class="p-h1" style="margin-top: 24px;">{半年<span>三步走</span>}</div>
  </div>

  <div class="p-timeline">
    <div class="p-tl-item">
      <div class="p-tl-date">{1月}</div>
      <div class="p-tl-dot"></div>
      <div class="p-tl-body"><div class="p-tl-h">{里程碑一}</div><div class="p-tl-sub">{一句说明}</div></div>
    </div>
    <div class="p-tl-item">
      <div class="p-tl-date">{3月}</div>
      <div class="p-tl-dot"></div>
      <div class="p-tl-body"><div class="p-tl-h">{里程碑二}</div><div class="p-tl-sub">{一句说明}</div></div>
    </div>
    <div class="p-tl-item">
      <div class="p-tl-date">{6月}</div>
      <div class="p-tl-dot"></div>
      <div class="p-tl-body"><div class="p-tl-h">{里程碑三}</div><div class="p-tl-sub">{一句说明}</div></div>
    </div>
  </div>

  <div class="p-foot">
    <span class="brand">{品牌 / 作者}</span>
    <span>{页码}</span>
  </div>
</div>
