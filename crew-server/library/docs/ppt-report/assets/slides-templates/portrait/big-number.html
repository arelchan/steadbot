<!--
  竖屏模板 · big-number（单巨型数字）
  低密度极致：整屏就一个数字 + 它是什么 + 一句解读。最大冲击、零干扰。
-->
<div class="slide center" id="sN" style="text-align: center; align-items: center;">
  <div class="p-eyebrow" style="margin: 0 auto;">{指标名 · 口径}</div>

  <div style="margin: 56px 0 40px;">
    <div class="p-display">68<span class="unit">%</span></div>
  </div>

  <div class="p-h2" style="max-width: 16em;">{这个数字代表什么 · 一句话}</div>
  <div class="p-lead" style="margin: 24px auto 0; text-align: center;">
    {一句解读 · 含对比或趋势 · <strong>同比 +12pt</strong>}
  </div>
</div>
