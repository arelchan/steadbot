<!--
  竖屏模板 · quote（金句 / 大结论卡）
  低密度极致：整屏一句话。让读者记住这一句、愿意截图转发。
-->
<div class="slide center" id="sN">
  <div class="p-quote-mark">“</div>
  <div class="p-quote" style="margin-top: -40px;">
    {一句核心金句，<span class="hl">关键词高亮</span>，短而有力，<br>让读者一眼记住、愿意转发}
  </div>
  <div class="p-foot" style="margin-top: 72px;">
    <span class="brand">{品牌 / 作者}</span>
    <span>{出处 / 页码}</span>
  </div>
</div>
