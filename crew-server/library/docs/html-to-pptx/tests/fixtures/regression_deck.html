<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  .slide { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #ffffff; }
  /* slide 1：装饰 div 组（负坐标圆 + 满页遮罩 + 徽章）——不得被误识别成 deck */
  .deco-circle { position: absolute; left: -200px; top: -150px; width: 500px; height: 500px;
                 border-radius: 50%; background: #e94560; }
  .overlay { position: absolute; inset: 0; background: rgba(10, 10, 40, 0.45); }
  .badge { position: absolute; top: 400px; left: 800px; width: 200px; height: 200px;
           border-radius: 50%; background: #ffffff; border: 6px solid #333333; }
  h1 { position: absolute; top: 460px; left: 300px; font-size: 64px; color: #ffffff;
       font-family: Arial, sans-serif; }
  h1 .hide-me { display: none; }
  h1 .accent { color: #e94560; }
  /* slide 2：永动 canvas + system-ui 文本 */
  .slide2 { background: #1a1a2e; }
  .slide2 p { position: absolute; top: 300px; left: 200px; font-size: 40px;
              color: #eeeeee; font-family: system-ui, sans-serif; }
  canvas { position: absolute; top: 500px; left: 200px; }
</style>
</head>
<body>
<section class="slide">
  <div class="deco-circle"></div>
  <div class="overlay"></div>
  <h1>Ship<span class="accent">Fast</span> now<span class="hide-me">HIDDEN</span></h1>
  <div class="badge"></div>
</section>
<section class="slide slide2">
  <p>Forever animating canvas below</p>
  <canvas id="cv" width="480" height="300"></canvas>
</section>
<script>
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  let t = 0;
  (function loop() {
    t += 0.05;
    ctx.fillStyle = 'rgb(' + (Math.floor(t * 997) % 256) + ', 80, 120)';
    ctx.fillRect(0, 0, 480, 300);
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
